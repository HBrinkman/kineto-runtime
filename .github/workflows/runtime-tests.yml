name: runtime-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id is the required status check name. Keep it stable.
  runtime-tests:
    name: runtime-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      FLATC_VERSION: "25.12.19"
      # sha256 of Linux.flatc.binary.g++-13.zip from the google/flatbuffers v25.12.19 release.
      FLATC_SHA256: "9f87066dc5dfa7fe02090b55bab5f3e55df03e32c9b0cdf229004ade7d091039"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.95.0"

      - name: flatc (pinned, checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flatc"
          curl -fsSL -o "$RUNNER_TEMP/flatc.zip" \
            "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          echo "${FLATC_SHA256}  $RUNNER_TEMP/flatc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/flatc.zip" -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Prerequisites
        run: scripts/bootstrap.sh check

      - name: Runtime host checks (engine, wasm parity, Flutter unit tests)
        run: scripts/bootstrap.sh test

      - name: Web example (headless Chromium smoke)
        run: |
          # Version pinned by runtimes/web/package.json; installed outside Git.
          npm install --no-save --no-package-lock playwright@1.61.0
          npx playwright install --with-deps chromium
          node examples/web/smoke.mjs

      - name: Tree unchanged by the checks
        run: |
          git status --porcelain --untracked-files=no
          git diff --exit-code

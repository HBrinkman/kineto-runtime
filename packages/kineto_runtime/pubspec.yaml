name: kineto_runtime
description: >-
  Plays Kineto runtime documents (.kvk) in Flutter: animations, state machines
  and touch, rendered by the Kineto Rust engine on iOS, Android and the web.
version: 0.1.0-dev.1
homepage: https://Kineto.keyvotion.com
repository: https://github.com/HBrinkman/kineto-runtime
issue_tracker: https://github.com/HBrinkman/kineto-runtime/issues
documentation: https://Kineto.keyvotion.com/docs/
topics:
  - animation
  - state-machine
  - ffi
  - wasm
  - runtime
# This checkout is not publishable: it has no prebuilt native libraries and
# links into runtimes/. scripts/package_flutter.sh stages the publishable
# package (libraries bundled, links resolved) and drops this line there only.
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.1.3
  web: ^1.1.1

flutter:
  assets:
    - web/pkg/kineto_engine.js
    - web/pkg/kineto_engine_bg.wasm
    - web/kineto_runtime_bridge.js
  plugin:
    platforms:
      ios:
        pluginClass: KinetoRuntimePlugin
      android:
        package: app.kineto.runtime.flutter
        pluginClass: KinetoRuntimePlugin
      web:
        pluginClass: KinetoRuntimeWebPlugin
        fileName: kineto_runtime_web.dart

dev_dependencies:
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
